[package]
name = "bento-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Bento stream processor: YAML-configured input -> processors -> output pipelines"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mongodb = "3"

[profile.release]
strip = true
lto = true
